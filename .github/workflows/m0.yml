name: M0 contracts and development licenses
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node infra/scripts/generate-contracts.mjs
      - run: node infra/scripts/generate-openapi.mjs
      - run: git diff --exit-code -- docs/contracts
      - run: npm run check
      # Tag publication is blocked; ordinary development checks can pass.
      - name: Release readiness (blocked while M0 remains open)
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:gate
